<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>夏夜唤灵簿</title>

  <link
    rel="manifest"
    href="/Summoning-of-Summer-Ghosts.github.io/manifest.webmanifest"
  />
  <meta name="theme-color" content="#111111" />
  <meta name="application-name" content="SummerGhosts" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SummerGhosts" />

  <link
    rel="icon"
    href="/Summoning-of-Summer-Ghosts.github.io/favicon.ico"
    sizes="any"
  />
  <link
    rel="apple-touch-icon"
    href="/Summoning-of-Summer-Ghosts.github.io/assets/icons/apple-touch-icon-180x180.png"
  />
  <link rel="preload" href="./assets/fonts/lilyshow.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./data/story.json" as="fetch" crossorigin />
  <link rel="preload" href="./data/lang/zh-cn.json" as="fetch" crossorigin />
  <link rel="preload" href="./data/achievements.json" as="fetch" crossorigin />
  <link rel="stylesheet" href="./assets/css/style.css" />

  <style>
    #pwa-install-btn {
      position: fixed;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      padding: 10px 14px;
      border: 0;
      border-radius: 12px;
      font-size: 14px;
      backdrop-filter: blur(8px);
      background: rgba(17, 17, 17, 0.85);
      color: #fff;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      z-index: 9999;
      display: none;
    }

    #pwa-guide-btn {
      position: fixed;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      padding: 10px 14px;
      border: 0;
      border-radius: 999px;
      font-size: 14px;
      background: rgba(17, 17, 17, 0.72);
      color: #fff;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
      cursor: pointer;
      z-index: 9999;
      display: none;
      backdrop-filter: blur(8px);
      font-family: 'lilyshow', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    #ios-install-tip {
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      max-width: min(92vw, 520px);
      color: #fff;
      background: rgba(17, 17, 17, 0.92);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      z-index: 9999;
      display: none;
    }

    #ios-install-tip a {
      color: #63b3ff;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app-container"></div>

  <audio id="bgm-player" loop preload="none"></audio>
  <audio id="sfx-hover-player" preload="none"></audio>
  <audio id="sfx-click-player" preload="none"></audio>
  <audio id="sfx-title-hover-player" preload="none"></audio>
  <audio id="sfx-title-click-player" preload="none"></audio>
  <audio id="sfx-sys-yes-player" preload="none"></audio>

  <button id="pwa-guide-btn" aria-label="显示安装说明">安装指引</button>
  <button id="pwa-install-btn" aria-label="安装应用">安装应用</button>
  <div id="ios-install-tip">
    <div id="install-tip-body"></div>
    <a id="ios-tip-close">知道了</a>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
